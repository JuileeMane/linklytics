services:
  - type: web
    name: linklytics-backend
    env: java
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: chmod +x ./mvnw && ./mvnw clean package -DskipTests
    startCommand: java -jar target/linklytics-backend-1.0.0.jar
    healthCheckPath: /api/health
    envVars:
      - key: JAVA_VERSION
        value: "17"
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false # Set to https://linklytics-azure.vercel.app or https://linklytics-backend-c30y.onrender.com
      - key: FRONTEND_URL
        sync: false # Set to https://linklytics-azure.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false # Set to https://*.vercel.app,https://linklytics-azure.vercel.app,http://localhost:5173
