spring:
  datasource:
    url: jdbc:h2:mem:linklyticstest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false

app:
  jwt:
    secret: testSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026LinkLyticsBTechProjectUnitTesting
    expiration-ms: 3600000
  base-url: http://localhost:8080
  frontend-url: http://localhost:5173
  cors:
    allowed-origins: http://localhost:5173
